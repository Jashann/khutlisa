[project]
name = "khutlisa"
version = "0.1.0"
description = "Finds money California holds in your name in its public unclaimed property register, checks your proof, and shows how it could be paid home."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "reportlab>=5.1.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khutlisa"]
